<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Little Question for You 💗</title>
<style>
:root{--pink:#ff5c9a}*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;color:white;font-family:"Trebuchet MS",system-ui,sans-serif;background:radial-gradient(ellipse at top,#63224f,#321333 48%,#12091d);display:flex;align-items:center;justify-content:center;padding:20px}
.glow{position:fixed;width:300px;height:300px;border-radius:50%;background:#ff4f9a30;filter:blur(70px);pointer-events:none;animation:drift 8s ease-in-out infinite alternate}.one{top:-90px;left:-70px}.two{right:-90px;bottom:-100px;background:#b94fff2b;animation-delay:-4s}@keyframes drift{to{transform:translate(55px,40px) scale(1.25)}}
.card{width:min(100%,480px);position:relative;z-index:2;text-align:center;padding:34px 24px 28px;border:1px solid #ffffff2a;border-radius:28px;background:linear-gradient(145deg,#ffffff16,#ffffff08);box-shadow:0 20px 80px #0005,inset 0 1px #ffffff20;backdrop-filter:blur(12px)}
.heart-icon{font-size:48px;display:inline-block;animation:heartbeat 1.5s infinite}@keyframes heartbeat{0%,100%{transform:scale(1)}15%{transform:scale(1.16)}30%{transform:scale(1)}45%{transform:scale(1.1)}}
.eyebrow{color:#ffc6db;letter-spacing:3px;font-size:11px;text-transform:uppercase;margin:8px 0 14px}h1{font-family:Georgia,serif;font-weight:normal;font-size:clamp(30px,8vw,43px);line-height:1.12;margin:0 0 14px}.sub{color:#f7dce9;line-height:1.65;font-size:15px;margin:0 auto 22px;max-width:340px}
.buttons{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;min-height:48px}button{border:0;border-radius:999px;padding:13px 24px;font-size:15px;font-weight:700;cursor:pointer;transition:transform .2s,box-shadow .2s}button:active{transform:scale(.96)}.yes{color:#54152f;background:linear-gradient(135deg,#ffd5e4,#ff78ae);box-shadow:0 7px 24px #ff5c9a40}.yes:hover{box-shadow:0 8px 30px #ff5c9a80;transform:translateY(-2px)}.no{color:white;background:#ffffff15;border:1px solid #ffffff35}
.music{margin-top:24px;display:inline-flex;gap:9px;align-items:center;color:#ffd5e4;background:#ffffff0c;border:1px solid #ffffff20;border-radius:999px;padding:10px 15px;font-size:12px}.music button{padding:0;background:transparent;color:white;font-size:15px}.hint{color:#d9b7cc;font-size:11px;margin-top:13px}
.float{position:fixed;bottom:-40px;z-index:1;pointer-events:none;opacity:0;animation:rise linear forwards;filter:drop-shadow(0 0 8px #ff8cbd55)}@keyframes rise{10%{opacity:.85}100%{transform:translateY(-115vh) rotate(25deg);opacity:0}}.burst{position:fixed;z-index:5;pointer-events:none;animation:burst 1.8s ease-out forwards}@keyframes burst{from{transform:translate(0,0) scale(.4);opacity:1}to{transform:translate(var(--x),var(--y)) scale(1.5);opacity:0}}.tiny{color:#ffc6db;font-size:12px;margin-top:18px}@media(max-width:380px){.card{padding:28px 17px 24px}button{padding:12px 20px}}
</style>
</head><body>
<div class="glow one"></div><div class="glow two"></div>
<main class="card" id="card">
<div class="heart-icon">💗</div><div class="eyebrow">A tiny question, just for you</div>
<h1>Can I steal a little more of your time?</h1>
<p class="sub">Because talking to you makes ordinary days feel a little more special… and I kinda want to make more memories with you. 🫶🏻</p>
<h2 style="font-size:20px;font-weight:500;margin:0 0 20px">Will you go out with me? 🌷</h2>
<div class="buttons"><button class="yes" id="yesBtn">Yes, let's go 💞</button><button class="no" id="noBtn">Let me think 🙈</button></div>
<div class="music"><button id="musicBtn" aria-label="Play or pause music">▶</button><span id="musicText">Tap to play our song</span><span>♫</span></div>
<div class="hint">Headphones recommended · good vibes required ✨</div>
<audio id="song" loop preload="metadata"><source src="song.mp3" type="audio/mpeg"></audio>
</main>
<script>
const song=document.getElementById('song'),musicBtn=document.getElementById('musicBtn'),musicText=document.getElementById('musicText'),noBtn=document.getElementById('noBtn'),card=document.getElementById('card');let noCount=0;
musicBtn.addEventListener('click',async()=>{if(song.paused){try{await song.play();musicBtn.textContent='Ⅱ';musicText.textContent='Playing just for you 💗'}catch{musicText.textContent='Add your song as song.mp3 first 🎵'}}else{song.pause();musicBtn.textContent='▶';musicText.textContent='Tap to play our song'}});
noBtn.addEventListener('click',()=>{noCount++;const messages=['Are you sure? 🥹','I can bring snacks too 😭','Just one little date? 🌷','I will behave… probably 🙈','Okay, take your time 💗'];noBtn.textContent=messages[Math.min(noCount-1,messages.length-1)];if(noCount<5)noBtn.style.transform=`rotate(${noCount%2?-4:4}deg)`});
document.getElementById('yesBtn').addEventListener('click',async()=>{card.innerHTML=`<div class="heart-icon">💖</div><div class="eyebrow">You just made me smile</div><h1>It's a date! 🥹</h1><p class="sub">Okay, now I'm going to be smiling at my phone like an idiot. Thank you for saying yes. Let's make it a memory worth keeping. 💗</p><div style="font-size:32px;margin-top:18px">🌷 💞 🌙</div><div class="tiny">P.S. You owe me one cute smile now.</div>`;for(let i=0;i<65;i++)setTimeout(makeBurst,i*22);if(song.paused){try{await song.play()}catch(e){}}});
function makeFloat(){const el=document.createElement('div');el.className='float';el.textContent=['♡','♥','💗','✨','💕','୨୧'][Math.floor(Math.random()*6)];el.style.left=Math.random()*100+'vw';el.style.fontSize=(14+Math.random()*25)+'px';el.style.animationDuration=(7+Math.random()*8)+'s';document.body.appendChild(el);setTimeout(()=>el.remove(),16000)}
function makeBurst(){const el=document.createElement('div');el.className='burst';el.textContent=['💗','💖','💕','✨','🌸'][Math.floor(Math.random()*5)];el.style.left=(innerWidth/2+(Math.random()-.5)*180)+'px';el.style.top=(innerHeight/2+(Math.random()-.5)*100)+'px';el.style.setProperty('--x',((Math.random()-.5)*innerWidth)+'px');el.style.setProperty('--y',((Math.random()-.5)*innerHeight)+'px');el.style.fontSize=(15+Math.random()*22)+'px';document.body.appendChild(el);setTimeout(()=>el.remove(),1900)}
setInterval(makeFloat,430);
</script></body></html>
